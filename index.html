<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>വരുന്നുണ്ടോ???</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#fff9ef;
  color:#222;
  font:18px system-ui,sans-serif;
  line-height:1.45;
}

main{
  width:min(calc(100% - 24px),620px);
  margin:auto;
  padding:35px 0 50px;
}

h1{
  text-align:center;
  font-size:clamp(36px,8vw,42px);
  line-height:1;
  margin:0 0 30px;
}

h2,h3{line-height:1.15}
h2{margin:0 0 12px}
h3{margin:0 0 8px}

.box{
  background:#fff;
  border:3px solid #222;
  border-radius:18px;
  padding:20px;
  margin:16px 0;
  box-shadow:5px 5px #222;
}

input,button{font:inherit}

input{
  display:block;
  width:100%;
  min-height:50px;
  padding:12px;
  border:2px solid #222;
  border-radius:11px;
  margin:8px 0 13px;
}

button{
  min-height:50px;
  border:2px solid #222;
  border-radius:13px;
  padding:10px 16px;
  background:#ffcf4a;
  font-weight:800;
  cursor:pointer;
}

.yes{background:#8ee6a8}
.no{background:#ff9b9b}

.choice{
  display:flex;
  gap:9px;
  margin:15px 0;
}

.choice button{flex:1}
.selected{outline:4px solid #222}

.person{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:11px 0;
  border-bottom:1px solid #ddd;
}

.person:last-child{border:0}
.muted{color:#777}

.link{
  overflow-wrap:anywhere;
  background:#f1eee7;
  padding:11px;
  border-radius:9px;
  margin:11px 0;
}

@media(max-width:340px){
  .choice{flex-direction:column}
}
</style>
</head>

<body>
<main>
  <h1>വരുന്നുണ്ടോ???</h1>
  <div id="app"></div>
</main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import{getDatabase,ref,set,push,onValue}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC-SDx67qExccNG9dejrtT62J8XJFaMEfo",
  authDomain: "are-you-coming-7d624.firebaseapp.com",
  databaseURL: "https://are-you-coming-7d624-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "are-you-coming-7d624",
  storageBucket: "are-you-coming-7d624.firebasestorage.app",
  messagingSenderId: "871889087284",
  appId: "1:871889087284:web:96de6b10f2e197ffc55361"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const auth=getAuth(app);
const root=document.querySelector("#app");

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])
);

const id=()=>crypto.randomUUID().replaceAll("-","").slice(0,8);
const url=id=>location.origin+location.pathname+"#e="+id;

function home(){
  root.innerHTML=`
    <div class="box">
      <h2>Make a thing.</h2>
      <input id="title" placeholder="Evening walk">
      <input id="when" type="datetime-local">
      <button id="create">Create →</button>
    </div>
    <p class="muted">Make a link. Send it to people. That's it.</p>
  `;

  document.querySelector("#create").onclick=async()=>{
    const title=document.querySelector("#title").value.trim();
    const when=document.querySelector("#when").value;

    if(!title||!when)return;

    const eventId=id();

    await set(ref(db,"events/"+eventId),{
      title,
      when,
      createdAt:Date.now(),
      responses:{}
    });

    location.hash="e="+eventId;
  };
}

function eventPage(eventId){
  root.innerHTML=`<p class="muted">Loading…</p>`;

  onValue(ref(db,"events/"+eventId),snap=>{
    const event=snap.val();

    if(!event){
      root.innerHTML=`
        <div class="box">
          <h2>Not found.</h2>
          <p>That thing doesn't exist.</p>
        </div>
      `;
      return;
    }

    const people=Object.entries(event.responses||{});
    const coming=people.filter(x=>x[1].status==="yes");
    const notComing=people.filter(x=>x[1].status==="no");

    const list=people=>people.length
      ?people.map(([,person])=>`
        <div class="person">
          <div>
            <strong>${esc(person.name)}</strong>
            ${person.note?`<div class="muted">${esc(person.note)}</div>`:""}
          </div>
          <b>${person.status==="yes"?"✓":"×"}</b>
        </div>
      `).join("")
      :`<p class="muted">Nobody yet.</p>`;

    root.innerHTML=`
      <div class="box">
        <h2>${esc(event.title)}</h2>

        <p>${new Date(event.when).toLocaleString([],{
          dateStyle:"medium",
          timeStyle:"short"
        })}</p>

        <div class="choice">
          <button class="yes" id="yes">YES</button>
          <button class="no" id="no">NO</button>
        </div>

        <input id="name" placeholder="Your name">
        <input id="note" placeholder="Notes (optional)">
        <button id="save">Save answer</button>
      </div>

      <div class="box">
        <h3>Coming · ${coming.length}</h3>
        ${list(coming)}
      </div>

      <div class="box">
        <h3>Not coming · ${notComing.length}</h3>
        ${list(notComing)}
      </div>

      <div class="box">
        <b>Share this link</b>
        <div class="link">${esc(url(eventId))}</div>
        <button id="copy">Copy link</button>
      </div>
    `;

    const yesButton=document.querySelector("#yes");
    const noButton=document.querySelector("#no");
    const saveButton=document.querySelector("#save");
    const copyButton=document.querySelector("#copy");

    let choice="";

    yesButton.onclick=()=>{
      choice="yes";
      yesButton.classList.add("selected");
      noButton.classList.remove("selected");
    };

    noButton.onclick=()=>{
      choice="no";
      noButton.classList.add("selected");
      yesButton.classList.remove("selected");
    };

    saveButton.onclick=async()=>{
      const name=document.querySelector("#name").value.trim();
      const note=document.querySelector("#note").value.trim();

      if(!name||!choice)
        return alert("Add your name and choose YES or NO.");

      const response={
        name,
        status:choice,
        note
      };

      if(auth.currentUser)
        response.uid=auth.currentUser.uid;

      await push(
        ref(db,`events/${eventId}/responses`),
        response
      );

      document.querySelector("#name").value="";
      document.querySelector("#note").value="";
      choice="";

      yesButton.classList.remove("selected");
      noButton.classList.remove("selected");
    };

    copyButton.onclick=async()=>{
      await navigator.clipboard.writeText(url(eventId));
      copyButton.textContent="Copied!";
      setTimeout(()=>copyButton.textContent="Copy link",1200);
    };
  });
}

function route(){
  const match=location.hash.match(/^#e=(.+)$/);
  match?eventPage(match[1]):home();
}

route();

signInAnonymously(auth).catch(()=>{});

addEventListener("hashchange",route);
</script>
</body>
</html>
